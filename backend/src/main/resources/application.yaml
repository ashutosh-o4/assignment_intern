spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.tasks.backend: DEBUG          # your package — see all logs
    org.hibernate.SQL: DEBUG          # see SQL statements

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true        #enables the "Try it out" button
    operations-sorter: method       #sort endpoints by HTTP method
    tags-sorter: alpha              #sorts tag group alphabetically
    display-request-duration: true  #show how long each request took
  api-docs:
    path: /v3/api-docs

jwt:

